name: Build Aecym Patches 9
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bundle-9.yml'
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract source project
        run: unzip -q 3-muse-glass-navbar-source.zip -d build-source
      - name: Add pink diagnostic and purple pill demo as separate opt-in patches
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          p = subprocess.check_output(['find', 'build-source', '-name', 'TranslucentNavBarPatch.kt']).decode().split()[0]
          orig = open(p).read()
          d = os.path.dirname(p)
          def rename(s, tag):
              for a, b in [
                  (r'\bNAV\b', tag.upper() + '_NAV'), (r'\bHELPER\b', tag.upper() + '_HELPER'), (r'\bCLONE\b', tag.upper() + '_CLONE'),
                  (r'\bNavBar\b', tag + 'NavBar'), (r'\bBackground\b', tag + 'Background'),
                  (r'museTranslucentNavBar', 'muse' + tag + 'NavBar'),
              ]:
                  s, n = re.subn(a, b, s)
                  assert n >= 1, a
              return s
          asm = re.compile(r'const v0, 0x3f19999a\s+invoke-static \{v1, v2, v0\}, LX/AH4;->A04\(JF\)J\s+move-result-wide v1')
          # 1) pink diagnostic
          s = rename(orig, 'Pink')
          s, n = asm.subn('const-wide v1, 0xFFFF149300000000L', s); assert n == 1, n
          s, n = re.subn(r'aecymNavTint60', 'aecymNavPink', s); assert n >= 1
          s, n = re.subn(r'name = "Translucent bottom tab bar \(experimental\)"', 'name = "DIAGNOSTIC pink bottom tab bar (test only)"', s); assert n == 1
          s, n = re.subn(r'description = "[^"]*"', 'description = "Test only. Paints the bottom tab bar solid pink. Choose one bottom-bar patch only."', s, count=1); assert n == 1
          open(os.path.join(d, 'PinkDiagnosticNavBarPatch.kt'), 'w').write(s)
          # 2) purple floating pill demo: clone body starts with margins, pill shape, violet fill, then returns
          pill = (
              'const/high16 v0, 0x41800000\n'
              'const/4 v1, 0x0\n'
              'const/high16 p0, 0x40c00000\n'
              'invoke-static {p1, v0, v1, v0, p0}, LX/9QZ;->A05(LX/9Tt;FFFF)LX/9Tt;\n'
              'move-result-object p1\n'
              'sget-object v0, LX/1Ov;->A00:LX/1Ov;\n'
              'const-wide v1, 0xD98A5CE000000000L\n'
              'invoke-static {p1, v0, v1, p0}, LX/1aV;->A02(LX/9Tt;LX/1pj;J)LX/9Tt;\n'
              'move-result-object v0\n'
              'return-object v0\n'
          )
          s = rename(orig, 'Pill')
          s, n = asm.subn(lambda m: pill, s); assert n == 1, n
          s, n = re.subn(r'tinted\.addInstructions\(\s*colorIndex \+ 1,', 'tinted.addInstructions(\n 0,', s); assert n == 1, n
          s, n = re.subn(r'aecymNavTint60', 'aecymNavPill', s); assert n >= 1
          s, n = re.subn(r'name = "Translucent bottom tab bar \(experimental\)"', 'name = "DEMO purple floating pill bottom tab bar (experimental)"', s); assert n == 1
          s, n = re.subn(r'description = "[^"]*"', 'description = "Demo. Inset rounded violet translucent bottom tab bar. No blur, no rim. Choose one bottom-bar patch only. Untested on a device."', s, count=1); assert n == 1
          open(os.path.join(d, 'PillDemoNavBarPatch.kt'), 'w').write(s)
          # 3) configurable colour, same proven geometry, no runtime UI or storage
          s = rename(orig, 'CustomColor')
          custom_pill = pill.replace('0xD98A5CE000000000L', '$packedColor')
          s, n = asm.subn(lambda m: custom_pill, s); assert n == 1, n
          s, n = re.subn(r'tinted\.addInstructions\(\s*colorIndex \+ 1,', 'tinted.addInstructions(\n 0,', s); assert n == 1, n
          s = s.replace('aecymNavTint60', 'aecymNavCustomColor')
          s = s.replace('import app.morphe.patcher.patch.patch', 'import app.morphe.patcher.patch.patch\nimport app.morphe.patcher.patch.stringOption')
          s = s.replace('name = "Translucent bottom tab bar (experimental)"', 'name = "Custom color floating pill bottom tab bar (experimental)"')
          s, n = re.subn(r'description = "[^"]*"', 'description = "Choose navbar color before patching. Rounded inset pill, fixed 85% opacity. No blur or runtime setting. Select only one navbar patch."', s, count=1); assert n == 1
          options = '\n'.join([
              '    val navbarColor by stringOption(',
              '        key = "navbarColor",',
              '        default = "#8A5CE0",',
              '        title = "Navbar color",',
              '        description = "Choose #RRGGBB. Keyboard violet by default. Fixed 85% opacity. Repatch to change.",',
              '        required = true,',
              '        values = linkedMapOf("Keyboard violet" to "#8A5CE0", "Ocean blue" to "#2563EB", "Emerald" to "#059669", "Rose" to "#E11D48", "Smoky grey" to "#374151"),',
              '        validator = { it != null && Regex("^#[0-9A-Fa-f]{6}$").matches(it) },',
              '    )',
              '',
              '    execute {',
              '        val rgb = checkNotNull(navbarColor).removePrefix("#").toLong(16)',
              '        val packedColor = "0x" + java.lang.Long.toHexString((0xD9000000L or rgb) shl 32) + "L"',
          ])
          s = s.replace('    execute {', options, 1)
          open(os.path.join(d, 'CustomColorNavBarPatch.kt'), 'w').write(s)
          # Upgrade only the custom-colour patch, retaining all earlier patches and releases.
          import base64
          custom_path = os.path.join(d, 'CustomColorNavBarPatch.kt')
          s = open(custom_path).read()
          s = s.replace(') {\n    compatibleWith(', ') {\n    extendWith("moving-lens.mpe")\n    compatibleWith(', 1)
          s = s.replace('Choose navbar color before patching. Rounded inset pill, fixed 85% opacity. No blur or runtime setting. Select only one navbar patch.', 'Moving glass-look lens prototype plus navbar color. Fixed 85% opacity. No real blur or refraction. Motion not phone-tested. Select only one navbar patch.')
          s = s.replace('move-result-object v0\nreturn-object v0', 'move-result-object v0\ninvoke-static {v0}, Lapp/aecym/muse/glass/MovingLens;->outer(Ljava/lang/Object;)Ljava/lang/Object;\nmove-result-object v0\ncheck-cast v0, LX/9Tt;\nreturn-object v0', 1)
          hooks = base64.b64decode('').decode()
          end = s.rfind('    }\n}')
          assert end > 0
          s = s[:end] + hooks + s[end:]
          assert 'extendWith("moving-lens.mpe")' in s and 'MovingLens;->outer' in s
          open(custom_path, 'w').write(s)
          open('MovingLens.java', 'w').write(base64.b64decode('').decode())
          # Grab-current-lens pointer handling, selecting once on release.
          s = open(custom_path).read()
          hooks = base64.b64decode('').decode()
          end = s.rfind('    }\n}')
          assert end > 0
          s = s[:end] + hooks + s[end:]
          s = s.replace('Moving glass-look lens prototype plus navbar color. Fixed 85% opacity. No real blur or refraction. Motion not phone-tested. Select only one navbar patch.', 'Grab the current bubble, drag, lift to switch tabs. Color option retained. Gesture prototype not phone-tested. No real blur/refraction. Select only one navbar patch.')
          open(custom_path, 'w').write(s)
          open('MovingLens.java', 'w').write(base64.b64decode('').decode())
          print('ok')
          PY
      - name: Keep one tested patch and apply Aecym branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root = Path('build-source/muse-glass-navbar')
          d = root / 'patches/src/main/kotlin/app/aecym/muse'
          for name in ['TranslucentNavBarPatch.kt', 'PinkDiagnosticNavBarPatch.kt', 'PillDemoNavBarPatch.kt']:
              p = d / name
              if p.exists():
                  p.unlink()
          assert [p.name for p in d.glob('*.kt')] == ['CustomColorNavBarPatch.kt'], list(d.glob('*.kt'))
          p = d / 'CustomColorNavBarPatch.kt'
          s = p.read_text()
          s = s.replace('Custom color floating pill bottom tab bar (experimental)', 'Floating bottom bar')
          import re
          s, n = re.subn(r'description = "[^"]*"', 'description = "Custom-colour rounded bar with an animated draggable bubble. Grab the bubble, drag and lift to switch tabs. Tried on one device with Muse 17.1.0.28.160. Cosmetic glass look, no backdrop blur."', s, count=1)
          assert n == 1
          assert s.count('default = false') == 1
          s = s.replace('default = false', 'default = true')
          assert s.count('isExperimental = true') == 1
          s = s.replace('isExperimental = true', 'isExperimental = false')
          p.write_text(s)
          p = root / 'patches/build.gradle.kts'
          s = p.read_text().replace('name = "Muse Glass Navbar"', 'name = "Aecym Patches"').replace('description = "Experimental bottom tab bar tint for Muse"', 'description = "Custom-colour floating bottom bar for Muse. Limited device testing."').replace('https://github.com/aecym-builds/muse-glass-navbar', 'https://github.com/aecym-builds/aecym-patches')
          p.write_text(s)
          Path('README.md').write_text(base64.b64decode('').decode())
          PY
      - name: Add account switcher patch (Muse 18.0.0.8.161)
        run: |
          DEST=build-source/muse-glass-navbar/patches/src/main/kotlin/app/aecym/muse
          cp AccountSwitcherPatch.kt "$DEST/AccountSwitcherPatch.kt"
          ls -l "$DEST"
      - name: Port symbol map to Muse 17.1.0.28.160
        run: python3 port-17.1.py
      - name: Build cosmetic drawing extension
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_JAR=$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)
          D8=$(find "$SDK/build-tools" -name d8 -type f | sort -V | tail -1)
          test -n "$ANDROID_JAR" && test -n "$D8"
          mkdir -p lens-classes lens-dex build-source/muse-glass-navbar/patches/src/main/resources
          javac -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -d lens-classes MovingLens.java
          jar cf moving-lens.jar -C lens-classes .
          "$D8" --release --min-api 26 --lib "$ANDROID_JAR" --output lens-dex moving-lens.jar
          cp lens-dex/classes.dex build-source/muse-glass-navbar/patches/src/main/resources/moving-lens.mpe
          test -s build-source/muse-glass-navbar/patches/src/main/resources/moving-lens.mpe
      - name: Build Android-compatible bundle
        working-directory: build-source/muse-glass-navbar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace
      - name: Verify bundle exists
        run: |
          find build-source/muse-glass-navbar/patches/build/libs -name '*.mpp' -type f -print
          test "$(find build-source/muse-glass-navbar/patches/build/libs -name '*.mpp' -type f | wc -l)" -eq 1
      - name: Publish release and point the existing source at it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build-source/muse-glass-navbar/patches/build/libs/*.mpp /tmp/patches-1.0.0.mpp
          gh release create bundle-9 /tmp/patches-1.0.0.mpp --title "Aecym Patches 9" --notes "Two patches. Account switcher unlocks the built-in switcher for Muse 18.0.0.8.161. Floating bottom bar for 17.1.0.28.160. selected by default for Muse 17.1.0.28.160. Colour picker and bundle-6 drag implementation retained. Old tint/pink/purple demos removed. Bundle branded Aecym Patches. Limited single-device testing confirms bar, animation and drag; not broad stability validation. No true backdrop blur or refraction. Historic bundles remain available."
          python3 - <<'PY'
          import json, datetime
          d = {
              "version": "1.0.9",
              "download_url": "https://github.com/aecym-builds/aecym-patches/releases/download/bundle-9/patches-1.0.0.mpp",
              "created_at": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%S'),
              "description": "Aecym Patches: account switcher for Muse 18.0.0.8.161, plus custom-colour floating bottom bar for 17.1.0.28.160. Animated bubble with grab-and-drag selection. Not yet device-tested on 17.1. No true backdrop blur.",
              "page_url": "https://github.com/aecym-builds/aecym-patches/releases/tag/bundle-9",
          }
          open('patches-bundle.json', 'w').write(json.dumps(d, indent=1) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json README.md
          git commit -m "Publish Aecym Patches 9 with one device-tried patch"
          git push origin HEAD:main

name: Build bundle with pink diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diagnostic-pink.yml'
permissions:
  contents: write
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Extract source project
        run: unzip -q 3-muse-glass-navbar-source.zip -d build-source
      - name: Add pink diagnostic as a second opt-in patch
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          p = subprocess.check_output(['find', 'build-source', '-name', 'TranslucentNavBarPatch.kt']).decode().split()[0]
          s = open(p).read()
          for a, b in [
              (r'\bNAV\b', 'PINK_NAV'), (r'\bHELPER\b', 'PINK_HELPER'), (r'\bCLONE\b', 'PINK_CLONE'),
              (r'\bNavBar\b', 'PinkNavBar'), (r'\bBackground\b', 'PinkBackground'),
              (r'museTranslucentNavBar', 'museDiagnosticPinkNavBar'), (r'aecymNavTint60', 'aecymNavPink'),
          ]:
              s, n = re.subn(a, b, s)
              assert n >= 1, a
          s, n = re.subn(r'const v0, 0x3f19999a\s+invoke-static \{v1, v2, v0\}, LX/AH4;->A04\(JF\)J\s+move-result-wide v1', 'const-wide v1, 0xFFFF149300000000L', s)
          assert n == 1, n
          s, n = re.subn(r'name = "Translucent bottom tab bar \(experimental\)"', 'name = "DIAGNOSTIC pink bottom tab bar (test only)"', s)
          assert n == 1, n
          s, n = re.subn(r'description = "[^"]*"', 'description = "Test only. Paints the bottom tab bar solid pink. Choose either this or the tint patch, not both."', s, count=1)
          assert n == 1, n
          out = os.path.join(os.path.dirname(p), 'PinkDiagnosticNavBarPatch.kt')
          open(out, 'w').write(s)
          print('wrote', out)
          PY
      - name: Build Android-compatible bundle
        working-directory: build-source/muse-glass-navbar
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace
      - name: Verify bundle exists
        run: |
          find build-source/muse-glass-navbar/patches/build/libs -name '*.mpp' -type f -print
          test "$(find build-source/muse-glass-navbar/patches/build/libs -name '*.mpp' -type f | wc -l)" -eq 1
      - name: Publish release and point the existing source at it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build-source/muse-glass-navbar/patches/build/libs/*.mpp /tmp/patches-1.0.0.mpp
          gh release create bundle-2 /tmp/patches-1.0.0.mpp --prerelease --title "Bundle 2: tint patch plus pink diagnostic" --notes 'Muse 17.0.0.10.160 only. Contains the original 60% tint patch (unchanged) and a separate opt-in DIAGNOSTIC pink patch that paints the bottom tab bar solid pink to test whether the hook controls the visible bar. Pink is off by default. Not device-tested.'
          python3 - <<'PY'
          import json, datetime
          d = {
              "version": "experimental-2",
              "download_url": "https://github.com/aecym-builds/aecym-patches/releases/download/bundle-2/patches-1.0.0.mpp",
              "created_at": datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%S'),
              "description": "aecym patches: experimental Muse 17.0.0.10.160 bottom tab bar. Tint patch plus an opt-in pink diagnostic. Not device-tested.",
              "page_url": "https://github.com/aecym-builds/aecym-patches/releases/tag/bundle-2",
          }
          open('patches-bundle.json', 'w').write(json.dumps(d, indent=1) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "Point bundle at bundle-2 (tint plus pink diagnostic)"
          git push origin HEAD:main
